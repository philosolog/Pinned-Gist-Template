[project]
name = "pinned-gist-template"
version = "0.1.0"
description = "A starter template for updating a pinned GitHub Gist on a schedule"
requires-python = ">=3.14"
dependencies = [
    "requests>=2.32.5",
]

[dependency-groups]
dev = [
    "mypy>=1.19.1",
    "ruff>=0.14.10",
    "types-requests>=2.32.4.20250913",
]
